<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bak's Radiology</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f7f9; --surface: #ffffff; --ink: #1d2433; --muted: #5b6474; --line: #dde1e8;
  --accent: #1f4e79; --accent-soft: #e5eef7; --mark: #ffe58a; --chip: #eef1f5; --shadow: 0 1px 2px rgba(16,24,40,.06);
  --k-carte: #1f4e79; --k-val: #2e7d32; --k-cr: #8a4b00; --k-box: #5b4b8a; --k-txt: #4a5568; --k-fig: #7a5c00; --k-tab: #00695c;
  --ok: #2e7d32; --ok-soft: #e6f3e7; --warn: #8a4b00; --warn-soft: #fbefdc; --todo: #9aa3b2; --k-cas: #b03a2e;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg: #12151b; --surface: #1b2029; --ink: #e6e9ef; --muted: #9aa3b2; --line: #2c3340;
  --accent: #8cb8e6; --accent-soft: #223246; --mark: #6b5a12; --chip: #252c38; --shadow: none;
  --k-carte: #8cb8e6; --k-val: #7fc98a; --k-cr: #e2a35c; --k-box: #b3a4e6; --k-txt: #b5bdc9; --k-fig: #d9bf6a; --k-tab: #6fd0c0;
  --ok: #7fc98a; --ok-soft: #1f3324; --warn: #e2a35c; --warn-soft: #3a2b17; --todo: #5b6474; --k-cas: #f08a7e;
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #12151b; --surface: #1b2029; --ink: #e6e9ef; --muted: #9aa3b2; --line: #2c3340;
  --accent: #8cb8e6; --accent-soft: #223246; --mark: #6b5a12; --chip: #252c38; --shadow: none;
  --k-carte: #8cb8e6; --k-val: #7fc98a; --k-cr: #e2a35c; --k-box: #b3a4e6; --k-txt: #b5bdc9; --k-fig: #d9bf6a; --k-tab: #6fd0c0;
  --ok: #7fc98a; --ok-soft: #1f3324; --warn: #e2a35c; --warn-soft: #3a2b17; --todo: #5b6474; --k-cas: #f08a7e;
}
* { box-sizing: border-box; }
:root[data-theme="light"] { color-scheme: light; }
select option, select optgroup { background: var(--surface); color: var(--ink); }
input::placeholder { color: var(--muted); opacity: 1; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Calibri, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: var(--shadow); }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
.top { display: flex; align-items: center; gap: 12px; padding: 12px 0 8px; }
.top h1 { font-size: 17px; margin: 0; color: var(--accent); white-space: nowrap; }
.searchbox { position: relative; flex: 1; }
#q { width: 100%; font-size: 17px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); outline: none; }
#q:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
#sugg { position: absolute; left: 0; right: 0; top: 100%; margin-top: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.12); display: none; overflow: hidden; }
#sugg div { padding: 7px 12px; cursor: pointer; font-size: 14px; }
#sugg div:hover, #sugg div.on { background: var(--accent-soft); }
#sugg small { color: var(--muted); }
.icon-btn { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 7px 10px; cursor: pointer; font-size: 14px; } a.icon-btn { text-decoration: none; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 0 10px; font-size: 13px; }
.filters select { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 5px 8px; font-size: 13px; max-width: 230px; }
.chip { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; padding: 3px 10px; cursor: pointer; user-select: none; }
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.chip.reset { background: none; color: var(--accent); border-style: dashed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--bg); color: var(--ink); padding: 5px 10px; cursor: pointer; font-size: 13px; }
.seg button.on { background: var(--accent); color: var(--surface); }
main { padding: 14px 0 60px; }
#status { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }
.group h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 22px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.blk { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--kc, var(--accent)); border-radius: 10px; padding: 10px 14px; margin: 0 0 10px; box-shadow: var(--shadow); }
.blk .hd { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 600; color: var(--kc); border: 1px solid var(--kc); border-radius: 999px; padding: 0 8px; white-space: nowrap; }
.blk .ti { font-weight: 650; font-size: 15.5px; }
.blk .bc { color: var(--muted); font-size: 12.5px; margin: 2px 0 6px; }
.blk .bc a { color: var(--accent); text-decoration: none; }
.blk .bc a:hover { text-decoration: underline; }
.blk .tx { white-space: pre-wrap; font-size: 14.5px; }
.blk table { border-collapse: collapse; width: 100%; font-size: 14px; margin-top: 4px; }
.blk td, .blk th { border: 1px solid var(--line); padding: 4px 8px; vertical-align: top; text-align: left; white-space: pre-wrap; }
.blk th { background: var(--accent-soft); font-weight: 600; }
.blk td:first-child { font-weight: 600; width: 26%; }
.blk .tools { display: flex; gap: 10px; margin-top: 6px; font-size: 12.5px; }
.blk .tools button, .blk .tools a { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-size: 12.5px; text-decoration: none; }
.blk .tools a:hover, .blk .tools button:hover { text-decoration: underline; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.more { display: block; margin: 12px auto; }
.help { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; font-size: 14px; }
.help code { background: var(--chip); padding: 1px 5px; border-radius: 4px; }
.k-Carte { --kc: var(--k-carte); } .k-Valeurs { --kc: var(--k-val); } .k-CR { --kc: var(--k-cr); } .k-Box { --kc: var(--k-box); }
.k-Texte { --kc: var(--k-txt); } .k-Figure { --kc: var(--k-fig); } .k-Tableau { --kc: var(--k-tab); }
.blk .ti.pv { cursor: pointer; }
.blk .ti.pv:hover { text-decoration: underline; }
#ov { position: fixed; inset: 0; background: rgba(10,14,22,.45); z-index: 20; display: none; }
#pv { position: fixed; top: 0; right: 0; bottom: 0; width: min(820px, 100%); background: var(--bg); z-index: 21; display: none; flex-direction: column; box-shadow: -8px 0 30px rgba(0,0,0,.25); }
#pv.open, #ov.open { display: flex; }
#pv .pvh { background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-direction: column; gap: 6px; }
#pv .pvh .r1 { display: flex; align-items: center; gap: 10px; }
#pv .pvh .r1 a.icon-btn { text-decoration: none; }
#pv .pvh .r1 b { flex: 1; font-size: 15.5px; color: var(--accent); }
#pv .pvh .r2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
#pv .pvh select { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 4px 8px; font-size: 13px; max-width: 100%; flex: 1; min-width: 180px; }
#pv .pvb { overflow-y: auto; padding: 8px 16px 60px; flex: 1; }
#pv h3.H1 { font-size: 18px; color: var(--accent); margin: 26px 0 8px; border-bottom: 2px solid var(--accent-soft); padding-bottom: 4px; }
#pv h3.H2 { font-size: 15.5px; color: var(--accent); margin: 18px 0 6px; }
#pv .blk { box-shadow: none; }
#pv .blk.hit { border-color: var(--k-cr); }
#pv .blk.target { outline: 3px solid var(--mark); outline-offset: 2px; }
#pv .blk .bc, #pv .blk .tools a { display: none; }
.figs { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 6px; }
.figs img { max-height: 220px; max-width: 100%; border-radius: 6px; border: 1px solid var(--line); background: #fff; cursor: zoom-in; }
#pv .figs img { max-height: 460px; }
#lb { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
#lb.open { display: flex; }
#lb img { max-width: 100%; max-height: 100%; border-radius: 6px; background: #fff; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; box-shadow: var(--shadow); }
.card h3 { margin: 0 0 8px; font-size: 15px; }
.card p { margin: 4px 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
/* mises à jour */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 6px 22px; align-items: center; }
.big { font-size: 42px; font-weight: 750; color: var(--accent); line-height: 1; }
.bar { height: 10px; background: var(--chip); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 999px; }
.trow { display: grid; grid-template-columns: minmax(170px, 260px) 1fr 70px 92px; gap: 12px; align-items: center; padding: 9px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.trow:hover { background: var(--chip); }
.trow .st { font-size: 12px; font-weight: 600; text-align: center; border-radius: 999px; padding: 1px 8px; }
.st.ok { background: var(--ok-soft); color: var(--ok); } .st.part { background: var(--warn-soft); color: var(--warn); } .st.todo { background: var(--chip); color: var(--muted); }
.tdocs { padding: 4px 4px 12px 18px; display: none; }
.tdocs.open { display: block; }
.tdocs table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.tdocs td { padding: 3px 8px; border-bottom: 1px dashed var(--line); }
.tdocs td.t { cursor: pointer; } .tdocs td.t:hover { color: var(--accent); text-decoration: underline; }
.tl { list-style: none; padding: 0; margin: 0; border-left: 2px solid var(--accent-soft); }
.tl li { padding: 4px 0 8px 14px; position: relative; font-size: 14px; }
.tl li::before { content: ''; position: absolute; left: -6px; top: 10px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.tl li time { color: var(--muted); font-size: 12.5px; margin-right: 8px; }
.decs details { border-bottom: 1px solid var(--line); padding: 6px 0; }
.decs summary { cursor: pointer; font-weight: 600; }
.decs ul { margin: 6px 0; padding-left: 20px; font-size: 13.8px; }
.decs li { margin: 4px 0; }
.decs li.dems { background: var(--warn-soft); border-radius: 6px; padding: 2px 6px; list-style-position: inside; margin-left: -20px; }
.sec-title { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 24px 0 10px; }
.notice { background: var(--warn-soft); border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; margin: 0 0 12px; }
.notice b { color: var(--warn); }
.pill { font-size: 11.5px; border-radius: 999px; padding: 1px 8px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.pill.dems { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.k-Cas { --kc: var(--k-cas); }
[hidden] { display: none !important; }
@media (max-width: 760px) { .trow { grid-template-columns: 1fr 60px; } .trow .bar, .trow .st { display: none; } }
@media (max-width: 640px) { .top h1 { display: none; } .blk td:first-child { width: 34%; } }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <h1><a id="brand" href="#" style="color:inherit;text-decoration:none">Bak's Radiology</a></h1>
    <div class="searchbox"><input id="q" type="search" placeholder="Pathologie, signe, mesure…  ex. kyste hydatique, « double contour », appendicite -enfant" autocomplete="off" disabled><div id="sugg"></div></div>
    <a class="icon-btn" id="homebtn" hidden>Thèmes</a><a class="icon-btn" id="majbtn" href="#maj" hidden>Mises à jour v2</a>
    <button class="icon-btn" id="theme" title="Thème clair / sombre">◐</button>
  </div>
  <div class="filters" id="filtersrow">
    <span class="seg" id="mode"><button data-m="fiche" class="on" title="Résultats regroupés par type de bloc">Fiche</button><button data-m="liste" title="Résultats classés par pertinence">Liste</button></span>
    <select id="fth"><option value="">Tous les thèmes</option></select>
    <select id="fdoc"><option value="">Tous les documents</option></select>
    <span id="fcol"></span>
    <span id="fkind"></span>
  </div>
</div></header>
<main class="wrap">
  <div id="status">Chargement de l’index…</div>
  <div id="res"></div>
  <section id="vmaj" hidden></section>
</main>
<div id="ov"></div>
<div id="lb"><img alt=""></div>
<aside id="pv" aria-label="Aperçu du document">
  <div class="pvh">
    <div class="r1"><b id="pvt"></b><a id="pvo" class="icon-btn" href="#" >Ouvrir</a><button class="icon-btn" id="pvx" title="Fermer (Échap)">✕</button></div>
    <div class="r2"><button class="icon-btn" id="pvp" title="Correspondance précédente">◀</button><span id="pvn"></span><button class="icon-btn" id="pvnx" title="Correspondance suivante">▶</button><select id="pvs" title="Aller à une partie"></select></div>
  </div>
  <div class="pvb" id="pvb"></div>
</aside>
<script id="idx" type="application/octet-stream"></script>
<script>
'use strict';
const CFG = { home: 'index.html', about: 'apropos.html', view: 'recherche' };
// ---------- utilitaires ----------
const $ = s => document.querySelector(s);
const fold = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’']/g, ' ').replace(/œ/g, 'oe').replace(/æ/g, 'ae');
const stem = w => (w.length > 4 && /[sx]$/.test(w)) ? w.slice(0, -1) : w;
const toks = s => (fold(s).match(/[a-z0-9]+/g) || []).map(stem);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = { get(k, d) { try { const v = localStorage.getItem('dems_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem('dems_' + k, JSON.stringify(v)); } catch (e) {} } };
const ORDER = ['Carte', 'Valeurs à retenir', 'Cas clinique', 'Pièges', 'Compte rendu type', 'Formulations du service', 'L’essentiel', 'Comprendre', 'Texte', 'Tableau', 'À retenir', 'Encadré', 'Figure'];
const KCLASS = k => ({ 'Carte': 'Carte', 'Valeurs à retenir': 'Valeurs', 'Compte rendu type': 'CR', 'Formulations du service': 'CR', 'Texte': 'Texte', 'Figure': 'Figure', 'Tableau': 'Tableau', 'Cas clinique': 'Cas' }[k] || 'Box');
const KBOOST = { 'Carte': 1.5, 'Valeurs à retenir': 1.35, 'Compte rendu type': 1.2, 'Formulations du service': 1.2, 'L’essentiel': 1.1, 'Tableau': 1.05, 'Texte': 1, 'Comprendre': 0.95, 'À retenir': 1.1, 'Pièges': 1.05, 'Encadré': 1, 'Figure': 0.75 };
let D, B, INV, VOCAB, NB, AVG, SYN, TITLES, DOCB, PHON, DOCKEY;
const docHref = (d, b) => (b && b.g != null) ? d.p + '#b' + b.g : encodeURI(d.p).replace(/#/g, '%23');
const openLabel = d => /\.docx$/i.test(d.p) ? 'Ouvrir dans Word' : 'Ouvrir la page';
const nf = n => n.toLocaleString('fr-FR');
const PRETTY = { 'Tete': 'Tête', 'mediastin': 'médiastin', 'genital': 'génital', 'Gynecologie': 'Gynécologie', 'Obstetrique': 'Obstétrique', 'Osteo-articulaire': 'Ostéo-articulaire',
  'Pediatrie': 'Pédiatrie', 'Medecine': 'Médecine', 'nucleaire': 'nucléaire' };
const pretty = th => th ? th.replace(/[A-Za-z-]+/g, w => PRETTY[w] || w) : '';


// ---------- chargement ----------
async function load() {
  const b64 = $('#idx').textContent.trim(); let txt;
  if (b64 && !b64.startsWith('__')) {
    const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    txt = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  } else {
    const buf = await (await fetch('search-index.json.gz')).arrayBuffer();
    try { txt = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text(); } catch (e) { txt = new TextDecoder().decode(buf); }
  }
  D = JSON.parse(txt); B = D.blocks;
  // texte de chaque bloc et index inversé (titre ×3, chemin ×1.5, contenu ×1)
  INV = new Map(); let total = 0;
  B.forEach((b, i) => {
    const doc = D.docs[b.d];
    b.body = b.x != null ? b.x : (b.r || []).map(r => r.join(' — ')).join('\n');
    b.path = [doc.n, ...(b.h || [])].join(' ');
    b.fold = fold(b.t + '\n' + b.body);
    b.tf = fold(b.t + ' ' + (b.h || []).join(' '));
    const tf = new Map();
    const add = (s, w) => toks(s).forEach(t => tf.set(t, (tf.get(t) || 0) + w));
    add(b.t, 3); add(b.path, 1.5); add(b.body, 1);
    let len = 0; tf.forEach(v => len += v); b.len = len; total += len;
    tf.forEach((v, t) => { let a = INV.get(t); if (!a) INV.set(t, a = []); a.push(i, v); });
  });
  NB = B.length; AVG = total / NB; VOCAB = [...INV.keys()].sort();
  PHON = new Map(); VOCAB.forEach(t => { if (t.length >= 4 && !/^\d/.test(t)) { const p = phon(t); let a = PHON.get(p); if (!a) PHON.set(p, a = []); a.push(t); } });
  D.docs.forEach(d => { d.nf = fold(d.n); d.f = d.f || d.p.split('/').pop(); });
  DOCKEY = new Map(D.docs.map((d, i) => [d.th + '/' + d.f, i]));
  DOCB = D.docs.map(() => []); B.forEach((b, i) => DOCB[b.d].push(i));
  SYN = new Map(); D.syn.forEach(g => { const fs = g.map(x => toks(x).join(' ')); fs.forEach(f => SYN.set(f, fs)); });
  const seen = new Set(); TITLES = [];
  B.forEach((b, i) => { if ((b.k === 'Carte' || b.k === 'Valeurs à retenir') && !seen.has(b.t)) { seen.add(b.t); TITLES.push([fold(b.t), b.t, D.docs[b.d].n]); } });
  initFilters();
  $('#q').disabled = false; $('#q').value = '';
  if (CFG.home && !CFG.home.startsWith('__')) { $('#homebtn').href = CFG.home; $('#homebtn').hidden = false; $('#brand').href = CFG.home; }
  if (D.maj) $('#majbtn').hidden = false;
  window.addEventListener('hashchange', route);
  route();
}

// ---------- requête ----------
// Mots reliés par ET, puis élargissement aux blocs qui en contiennent la plupart ; fautes tolérées ; « valeurs », « pièges », « cas »… orientent le classement.
const CLASSIF = /classification|stade|stadification|grade|score|criteres|\btnm\b|figo|rads\b|staging/;
const STOP = new Set('de du des d la le les l un une et ou en au aux a chez sur dans par pour avec quel quelle quel quelles comment pourquoi quoi qu que qui est sont faire devant lors se sa son ses ce cette cet on y il elle ils the of and in to'.split(' '));
const INTENTS = [
  { re: /^(valeur|seuil|mesure|normale?|chiffre|norme|limite)$/, k: { 'Valeurs à retenir': 2.3, 'Tableau': 1.3 }, label: 'valeurs à retenir' },
  { re: /^(piege|erreur|pitfall)$/, k: { 'Pièges': 2.6 }, label: 'pièges' },
  { re: /^(ca|cas|clinique|oral)$/, k: { 'Cas clinique': 2.6 }, label: 'cas cliniques' },
  { re: /^(differentiel|dd)$/, f: /differentiel|evoquer|eliminer|diagnostic/, k: { 'Tableau': 1.4, 'Carte': 1.2 }, label: 'diagnostics différentiels' },
  { re: /^(classification|stade|stadification|score|grade)$/, f: CLASSIF, label: 'classifications' },
  { re: /^(compte|rendu|cr|conclusion)$/, k: { 'Compte rendu type': 2.3, 'Formulations du service': 1.8 }, label: 'comptes rendus' },
];
function parseQuery(q) {
  const phrases = [], excl = [], words = [];
  q = q.replace(/[«“"]([^»”"]+)[»”"]/g, (m, p) => { phrases.push(fold(p).trim()); return ' '; });
  q.split(/\s+/).filter(Boolean).forEach(w => { if (w.startsWith('-') && w.length > 1) excl.push(...toks(w.slice(1))); else words.push(w); });
  let tk = toks(words.join(' '));
  const kept = tk.filter(t => !STOP.has(t)); if (kept.length) tk = kept;
  // intentions (valeurs, pièges, cas…) : orientent le classement au lieu d'être exigées

  else if (e.key === 'ArrowLeft' || e.key === 'p') pvNav(-1);
});
$('#vmaj').addEventListener('click', e => { const p = e.target.closest('[data-pv]'); if (p) preview(+p.dataset.pv); });
$('#res').addEventListener('click', e => {
  const c = e.target.dataset.copy, f = e.target.dataset.full, pv = e.target.closest('[data-pv]');
  if (e.target.classList.contains('more')) { render(true); return; }
  if (pv) { preview(+pv.dataset.pv); return; }
  if (f != null) { const el = e.target.closest('.blk'); el.outerHTML = blockHTML(+f, LAST.terms, LAST.phrases || [], true); return; }
  if (c != null) { const b = B[+c]; const t = b.t + '\n' + (b.r ? b.r.map(r => r.join(' : ')).join('\n') : b.x);
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => { e.target.textContent = 'Copié ✓'; setTimeout(() => e.target.textContent = 'Copier', 1500); }).catch(() => {}); }
});
// ---------- agrandissement des images ----------
document.addEventListener('click', e => {
  if (e.target.dataset && e.target.dataset.zoom) { e.stopPropagation(); $('#lb img').src = e.target.src; $('#lb').classList.add('open'); return; }
  if (e.target.closest('#lb')) $('#lb').classList.remove('open');
}, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#lb').classList.contains('open')) { $('#lb').classList.remove('open'); e.stopImmediatePropagation(); } }, true);
// ---------- navigation : recherche / mises à jour v2 ----------
function route() {
  let v = location.hash.slice(1);
  if (v !== 'maj' && v !== 'recherche') v = (CFG.view && !CFG.view.startsWith('__')) ? CFG.view : 'recherche';
  if (v === 'maj' && !D.maj) v = 'recherche';
  const m = v === 'maj';
  $('#vmaj').hidden = !m; $('#status').hidden = m; $('#res').hidden = m;
  document.querySelectorAll('.searchbox, #filtersrow').forEach(x => x.hidden = m);
  $('#majbtn').textContent = m ? 'Recherche' : 'Mises à jour v2'; $('#majbtn').href = m ? '#recherche' : '#maj';
  if (m) showMaj();
  else { $('#status').textContent = `${D.docs.length} documents · ${nf(NB)} blocs indexés · index du ${D.built}`; run(); $('#q').focus(); }
  window.scrollTo(0, 0);
}
function showMaj() {
  const M = D.maj, all = M.themes.flatMap(t => t.docs), done = all.filter(d => d.ok).length, pct = Math.round(100 * done / all.length);
  const cas = all.reduce((a, d) => a + d.cas, 0), rp = all.reduce((a, d) => a + (d.rp || 0), 0);
  const st = t => t.docs.every(x => x.ok) ? ['ok', 'terminé'] : t.docs.some(x => x.ok) ? ['part', 'en cours'] : ['todo', 'à faire'];
  const dems = M.dec.filter(x => x.dems);
  const next = M.themes.filter(t => !t.docs.every(x => x.ok));
  let h = `<div class="card"><div class="hero"><div class="big">${pct} %</div><div><div style="font-weight:650;font-size:16px">${done} documents enrichis sur ${all.length}</div>
      <div class="bar" style="margin:8px 0"><i style="width:${pct}%"></i></div>
      <div class="muted small">${nf(cas)} cas cliniques · ${nf(rp)} cas Radiopaedia cités · ${M.dec.length} décisions ouvertes, dont ${dems.length} face au cours DEMS · mis à jour le ${esc(D.built)}</div></div></div></div>
    <p class="muted small" style="margin:10px 2px">Étape 2 : chaque résumé est complété à partir de Radiopaedia, Radiology Assistant, echo-loco et des cours locaux (AZ DEMS, Spécial DEMS, planchage, SFR) ; les QCM sont remplacés par des cas cliniques au format de l’oral et une fiche type. Les valeurs vertes ne changent pas : les écarts trouvés sont listés en bas, à trancher. Cette page se met à jour après chaque thème.</p>
    <div class="sec-title">Avancement par thème</div><div class="card" style="padding:4px 12px">`;
  M.themes.forEach((t, k) => {
    const d = t.docs.filter(x => x.ok).length, [c, l] = st(t);
    h += `<div class="trow" data-t="${k}"><span>${esc(pretty(t.th))}</span><div class="bar"><i style="width:${Math.round(100 * d / t.docs.length)}%"></i></div><span class="small">${d} / ${t.docs.length}</span><span class="st ${c}">${l}</span></div>
      <div class="tdocs" id="td${k}"><table>${t.docs.map(x => { const di = DOCKEY.get(t.th + '/' + x.f);
        return `<tr><td class="muted">${String(x.n).padStart(2, '0')}</td><td class="${di != null ? 't' : ''}" ${di != null ? `data-pv="${DOCB[di][0]}"` : ''}>${esc(x.t)}</td><td>${x.ok ? '<span class="pill ok">enrichi</span>' : '<span class="pill">à faire</span>'}</td><td class="muted small">${x.cas ? x.cas + ' cas' : ''}</td><td class="muted small">${x.rp ? x.rp + ' Radiopaedia' : ''}</td><td class="muted small">${esc(x.dt || '')}</td></tr>`; }).join('')}</table></div>`;
  });
  h += '</div>';
  if (next.length) h += `<div class="sec-title">Prochaines étapes</div><div class="card"><div class="chips">${next.map(t => `<span class="pill">${esc(pretty(t.th))} · ${t.docs.filter(x => !x.ok).length} à faire</span>`).join('')}</div></div>`;
  if (M.journal.length) h += `<div class="sec-title">Journal</div><div class="card"><ul class="tl">${M.journal.map(([dt, s]) => `<li><time>${esc(dt)}</time>${esc(s)}</li>`).join('')}</ul></div>`;
  if (M.dec.length) {
    const secs = new Map(); M.dec.forEach(x => { if (!secs.has(x.s)) secs.set(x.s, []); secs.get(x.s).push(x); });
    h += `<div class="sec-title">Décisions ouvertes · ${M.dec.length}</div><div class="card decs">
      <p class="small muted">Écarts de valeurs relevés pendant l’enrichissement. <span class="pill dems">cours DEMS</span> : le cours DEMS diffère du résumé — selon la règle des valeurs, il devrait l’emporter ; à arbitrer en premier.</p>
      ${dems.length ? `<details open><summary>Face au cours DEMS · ${dems.length}</summary><ul>${dems.map(x => `<li class="dems"><span class="muted small">${esc(x.s)} — </span>${esc(x.x)}</li>`).join('')}</ul></details>` : ''}
      ${[...secs].map(([s, l]) => `<details><summary>${esc(s || 'Divers')} · ${l.length}</summary><ul>${l.map(x => `<li class="${x.dems ? 'dems' : ''}">${esc(x.x)}</li>`).join('')}</ul></details>`).join('')}</div>`;
  }
  $('#vmaj').innerHTML = h;
  $('#vmaj').querySelectorAll('.trow').forEach(r => r.onclick = () => $('#td' + r.dataset.t).classList.toggle('open'));
}

// ---------- thème ----------
const applyTheme = t => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
applyTheme(store.get('theme', ''));
$('#theme').onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const nx = cur === 'dark' ? 'light' : 'dark'; applyTheme(nx); store.set('theme', nx); };
load().catch(err => { $('#status').textContent = 'Erreur de chargement de l’index : ' + err.message + ' (navigateur trop ancien ? utilisez Chrome, Edge ou Firefox récents).'; });
</script>
</body>
</html>
