<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bak's Radiology</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f7f9; --surface: #ffffff; --ink: #1d2433; --muted: #5b6474; --line: #dde1e8;
  --accent: #1f4e79; --accent-soft: #e5eef7; --mark: #ffe58a; --chip: #eef1f5; --shadow: 0 1px 2px rgba(16,24,40,.06);
  --ok: #2e7d32; --ok-soft: #e6f3e7; --warn: #8a4b00; --warn-soft: #fbefdc; --todo: #9aa3b2;
  --k-carte: #1f4e79; --k-val: #2e7d32; --k-cr: #8a4b00; --k-box: #5b4b8a; --k-txt: #4a5568; --k-fig: #7a5c00; --k-tab: #00695c; --k-cas: #b03a2e;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg: #12151b; --surface: #1b2029; --ink: #e6e9ef; --muted: #9aa3b2; --line: #2c3340;
  --accent: #8cb8e6; --accent-soft: #223246; --mark: #6b5a12; --chip: #252c38; --shadow: none;
  --ok: #7fc98a; --ok-soft: #1f3324; --warn: #e2a35c; --warn-soft: #3a2b17; --todo: #5b6474;
  --k-carte: #8cb8e6; --k-val: #7fc98a; --k-cr: #e2a35c; --k-box: #b3a4e6; --k-txt: #b5bdc9; --k-fig: #d9bf6a; --k-tab: #6fd0c0; --k-cas: #f08a7e;
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #12151b; --surface: #1b2029; --ink: #e6e9ef; --muted: #9aa3b2; --line: #2c3340;
  --accent: #8cb8e6; --accent-soft: #223246; --mark: #6b5a12; --chip: #252c38; --shadow: none;
  --ok: #7fc98a; --ok-soft: #1f3324; --warn: #e2a35c; --warn-soft: #3a2b17; --todo: #5b6474;
  --k-carte: #8cb8e6; --k-val: #7fc98a; --k-cr: #e2a35c; --k-box: #b3a4e6; --k-txt: #b5bdc9; --k-fig: #d9bf6a; --k-tab: #6fd0c0; --k-cas: #f08a7e;
}
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
select option, select optgroup { background: var(--surface); color: var(--ink); }
input::placeholder { color: var(--muted); opacity: 1; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Calibri, sans-serif; }
a { color: var(--accent); }
header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: var(--shadow); }
.wrap { max-width: 1140px; margin: 0 auto; padding: 0 16px; }
.top { display: flex; align-items: center; gap: 14px; padding: 10px 0; flex-wrap: wrap; }
.brand { font-size: 18px; font-weight: 700; color: var(--accent); text-decoration: none; white-space: nowrap; letter-spacing: .01em; }
.brand span { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button, .tabs a { border: 0; background: none; color: var(--muted); font-size: 14.5px; padding: 7px 12px; border-radius: 8px; cursor: pointer; text-decoration: none; font-weight: 550; }
.tabs button:hover, .tabs a:hover { background: var(--chip); color: var(--ink); }
.tabs button.on { background: var(--accent-soft); color: var(--accent); }
.sp { flex: 1; }
.icon-btn { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 14px; text-decoration: none; }
.icon-btn:hover { border-color: var(--accent); }
.searchrow { padding: 0 0 10px; }
.searchbox { position: relative; }
#q { width: 100%; font-size: 17px; padding: 11px 14px 11px 40px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); outline: none; }
#q:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.searchbox .lens { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; font-size: 16px; }
#sugg { position: absolute; left: 0; right: 0; top: 100%; margin-top: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.12); display: none; overflow: hidden; z-index: 6; }
#sugg div { padding: 7px 12px; cursor: pointer; font-size: 14px; }
#sugg div:hover, #sugg div.on { background: var(--accent-soft); }
#sugg small { color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 0 0; font-size: 13px; }
.filters select { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 5px 8px; font-size: 13px; max-width: 230px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; padding: 3px 11px; cursor: pointer; user-select: none; font-size: 13px; white-space: nowrap; }
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.chip.reset { background: none; color: var(--accent); border-style: dashed; }
.chip .n { opacity: .7; margin-left: 4px; font-size: 12px; }
.chip.zero { opacity: .45; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--bg); color: var(--ink); padding: 5px 11px; cursor: pointer; font-size: 13px; }
.seg button.on { background: var(--accent); color: var(--surface); }
.linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; font-size: 13px; padding: 0; }
.linkbtn:hover { text-decoration: underline; }
main { padding: 14px 0 60px; }
#status { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
.notice { background: var(--warn-soft); border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; margin: 0 0 12px; }
.notice b { color: var(--warn); }
.group h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 22px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.blk { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--kc, var(--accent)); border-radius: 10px; padding: 10px 14px; margin: 0 0 10px; box-shadow: var(--shadow); }
.blk .hd { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 600; color: var(--kc, var(--accent)); border: 1px solid var(--kc, var(--accent)); border-radius: 999px; padding: 0 8px; white-space: nowrap; }
.blk .ti { font-weight: 650; font-size: 15.5px; }
.blk .bc { color: var(--muted); font-size: 12.5px; margin: 2px 0 6px; }
.blk .bc a { color: var(--accent); text-decoration: none; }
.blk .bc a:hover { text-decoration: underline; }
.blk .tx { white-space: pre-wrap; font-size: 14.5px; }
.blk .cr { color: var(--muted); font-size: 12px; margin-top: 4px; }
.blk table { border-collapse: collapse; width: 100%; font-size: 14px; margin-top: 4px; }
.blk td, .blk th { border: 1px solid var(--line); padding: 4px 8px; vertical-align: top; text-align: left; white-space: pre-wrap; }
.blk th { background: var(--accent-soft); font-weight: 600; }
.blk td:first-child { font-weight: 600; width: 26%; }
.blk .tools { display: flex; gap: 12px; margin-top: 6px; font-size: 12.5px; flex-wrap: wrap; }
.blk .tools button, .blk .tools a { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-size: 12.5px; text-decoration: none; }
.blk .tools a:hover, .blk .tools button:hover { text-decoration: underline; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.more { display: block; margin: 12px auto; }
.k-Carte { --kc: var(--k-carte); } .k-Valeurs { --kc: var(--k-val); } .k-CR { --kc: var(--k-cr); } .k-Box { --kc: var(--k-box); }
.k-Texte { --kc: var(--k-txt); } .k-Figure { --kc: var(--k-fig); } .k-Tableau { --kc: var(--k-tab); } .k-Cas { --kc: var(--k-cas); }
.blk .ti.pv { cursor: pointer; }
.blk .ti.pv:hover { text-decoration: underline; }
/* accueil */
.welcome { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; box-shadow: var(--shadow); }
.card h3 { margin: 0 0 8px; font-size: 15px; }
.card p { margin: 4px 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.shortcuts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.shortcut { cursor: pointer; text-decoration: none; color: inherit; display: block; }
.shortcut:hover { border-color: var(--accent); }
.shortcut b { color: var(--accent); font-size: 15.5px; }
details.help summary { cursor: pointer; font-weight: 600; }
details.help code, .card code { background: var(--chip); padding: 1px 5px; border-radius: 4px; }
details.help ul { margin: 8px 0 0; padding-left: 20px; }
/* aperçu */
#ov { position: fixed; inset: 0; background: rgba(10,14,22,.45); z-index: 20; display: none; }
#pv { position: fixed; top: 0; right: 0; bottom: 0; width: min(840px, 100%); background: var(--bg); z-index: 21; display: none; flex-direction: column; box-shadow: -8px 0 30px rgba(0,0,0,.25); }
#pv.open, #ov.open { display: flex; }
#pv .pvh { background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-direction: column; gap: 6px; }
#pv .pvh .r1 { display: flex; align-items: center; gap: 10px; }
#pv .pvh .r1 b { flex: 1; font-size: 15.5px; color: var(--accent); }
#pv .pvh .r2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
#pv .pvh select { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 4px 8px; font-size: 13px; max-width: 100%; flex: 1; min-width: 180px; }
#pv .pvb { overflow-y: auto; padding: 8px 16px 60px; flex: 1; }
#pv h3.H1 { font-size: 18px; color: var(--accent); margin: 26px 0 8px; border-bottom: 2px solid var(--accent-soft); padding-bottom: 4px; }
#pv h3.H2 { font-size: 15.5px; color: var(--accent); margin: 18px 0 6px; }
#pv .blk { box-shadow: none; }
#pv .blk.hit { border-color: var(--k-cr); }
#pv .blk.target { outline: 3px solid var(--mark); outline-offset: 2px; }
#pv .blk .bc, #pv .blk .tools a { display: none; }
.figs { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 6px; }
.figs img { max-height: 220px; max-width: 100%; border-radius: 6px; border: 1px solid var(--line); background: #fff; cursor: zoom-in; }
#pv .figs img { max-height: 460px; }
#lb { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
#lb.open { display: flex; }
#lb img { max-width: 100%; max-height: 100%; border-radius: 6px; background: #fff; }
/* cours */
.cgrid { display: grid; grid-template-columns: 250px 1fr; gap: 18px; align-items: start; }
.cside { position: sticky; top: 76px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; max-height: calc(100vh - 96px); overflow-y: auto; }
.cside button { display: flex; width: 100%; gap: 8px; align-items: center; text-align: left; border: 0; background: none; color: var(--ink); padding: 7px 9px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.cside button:hover { background: var(--chip); }
.cside button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.cside button small { margin-left: auto; color: var(--muted); font-weight: 400; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--todo); }
.dot.ok { background: var(--ok); } .dot.part { background: var(--warn); }
.chead h2 { margin: 0 0 4px; font-size: 22px; color: var(--accent); }
.chead { margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: end; justify-content: space-between; }
.dcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.dcard .dh { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.dcard .dh b { font-size: 16px; cursor: pointer; }
.dcard .dh b:hover { color: var(--accent); }
.pill { font-size: 11.5px; border-radius: 999px; padding: 1px 8px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.pill.dems { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.ess { margin: 8px 0 4px; padding-left: 20px; font-size: 14.2px; }
.ess li { margin: 2px 0; }
.dact { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.dact button, .dact a { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; text-decoration: none; }
.dact button:hover, .dact a:hover { border-color: var(--accent); color: var(--accent); }
.dact button.on { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.dx { margin-top: 10px; }
.dx:empty { display: none; }
details.rep { margin: -4px 0 10px; }
details.rep summary { cursor: pointer; color: var(--k-cas); font-weight: 600; font-size: 13.5px; padding: 4px 0; }
.srcl { list-style: none; padding: 0; margin: 0; }
.srcl li { display: flex; gap: 8px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 14.2px; }
.srcl li a { margin-left: auto; font-size: 12.5px; white-space: nowrap; }
/* mises à jour */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 6px 22px; align-items: center; }
.big { font-size: 42px; font-weight: 750; color: var(--accent); line-height: 1; }
.bar { height: 10px; background: var(--chip); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 999px; }
.trow { display: grid; grid-template-columns: minmax(170px, 260px) 1fr 70px 92px; gap: 12px; align-items: center; padding: 9px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.trow:hover { background: var(--chip); }
.trow .st { font-size: 12px; font-weight: 600; text-align: center; border-radius: 999px; padding: 1px 8px; }
.st.ok { background: var(--ok-soft); color: var(--ok); } .st.part { background: var(--warn-soft); color: var(--warn); } .st.todo { background: var(--chip); color: var(--muted); }
.tdocs { padding: 4px 4px 12px 18px; display: none; }
.tdocs.open { display: block; }
.tdocs table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.tdocs td { padding: 3px 8px; border-bottom: 1px dashed var(--line); }
.tdocs td.t { cursor: pointer; } .tdocs td.t:hover { color: var(--accent); text-decoration: underline; }
.tl { list-style: none; padding: 0; margin: 0; border-left: 2px solid var(--accent-soft); }
.tl li { padding: 4px 0 8px 14px; position: relative; font-size: 14px; }
.tl li::before { content: ''; position: absolute; left: -6px; top: 10px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.tl li time { color: var(--muted); font-size: 12.5px; margin-right: 8px; }
.decs details { border-bottom: 1px solid var(--line); padding: 6px 0; }
.decs summary { cursor: pointer; font-weight: 600; }
.decs ul { margin: 6px 0; padding-left: 20px; font-size: 13.8px; }
.decs li { margin: 4px 0; }
.decs li.dems { background: var(--warn-soft); border-radius: 6px; padding: 2px 6px; list-style-position: inside; margin-left: -20px; }
.sec-title { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 24px 0 10px; }
[hidden] { display: none !important; }
@media (max-width: 760px) {
  .cgrid { grid-template-columns: 1fr; } .cside { position: static; max-height: 240px; }
  .trow { grid-template-columns: 1fr 60px; } .trow .bar, .trow .st { display: none; }
  .blk td:first-child { width: 34%; } .brand span { display: none; }
}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <a class="brand" id="brand" href="#recherche">Bak's Radiology<span>radiologie · DEMS 2027</span></a>
    <nav class="tabs" id="tabs">
      <a id="homeLink" hidden>Thèmes</a>
      <button data-v="recherche">Recherche</button>
      <button data-v="cours" hidden>Cours</button>
      <button data-v="maj" hidden>Mises à jour v2</button>
      <a id="aboutLink" hidden>À propos</a>
    </nav>
    <span class="sp"></span>
    <button class="icon-btn" id="theme" title="Thème clair / sombre">◐</button>
  </div>
  <div class="searchrow" id="searchrow">
    <div class="searchbox"><span class="lens">⌕</span><input id="q" type="search" placeholder="Une pathologie, un signe, une question…  ex. lésion lytique épiphysaire de l’enfant" autocomplete="off" disabled><div id="sugg"></div></div>
    <div class="filters">
      <span class="seg" id="mode"><button data-m="fiche" class="on" title="Résultats regroupés par type de bloc">Fiche</button><button data-m="liste" title="Résultats classés par pertinence">Liste</button></span>
      <select id="fth"><option value="">Tous les thèmes</option></select>
      <select id="fdoc"><option value="">Tous les documents</option></select>
      <button class="linkbtn" id="moref">Plus de filtres</button>
    </div>
    <div class="filters"><span class="chips" id="fkind"></span></div>
    <div class="filters" id="fcolrow" hidden><span class="muted">Collection :</span><span class="chips" id="fcol"></span></div>
  </div>
</div></header>
<main class="wrap">
  <section id="v-recherche">
    <div id="status">Chargement de l’index…</div>
    <div id="notice"></div>
    <div id="res"></div>
  </section>
  <section id="v-cours" hidden><div class="cgrid"><aside class="cside" id="cside"></aside><div id="cmain"></div></div></section>
  <section id="v-maj" hidden></section>
</main>
<div id="ov"></div>
<div id="lb"><img alt=""></div>
<aside id="pv" aria-label="Aperçu du document">
  <div class="pvh">
    <div class="r1"><b id="pvt"></b><a id="pvo" class="icon-btn" href="#">Ouvrir</a><button class="icon-btn" id="pvx" title="Fermer (Échap)">✕</button></div>
    <div class="r2"><button class="icon-btn" id="pvp" title="Correspondance précédente">◀</button><span id="pvn"></span><button class="icon-btn" id="pvnx" title="Correspondance suivante">▶</button><select id="pvs" title="Aller à une partie"></select></div>
  </div>
  <div class="pvb" id="pvb"></div>
</aside>
<script id="idx" type="application/octet-stream"></script>
<script>
'use strict';
const CFG = { home: 'index.html', about: 'apropos.html', view: 'cours' };
// ---------- utilitaires ----------
const $ = s => document.querySelector(s);
const fold = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’']/g, ' ').replace(/œ/g, 'oe').replace(/æ/g, 'ae');
const stem = w => (w.length > 4 && /[sx]$/.test(w)) ? w.slice(0, -1) : w;
const toks = s => (fold(s).match(/[a-z0-9]+/g) || []).map(stem);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = { get(k, d) { try { const v = localStorage.getItem('dems_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem('dems_' + k, JSON.stringify(v)); } catch (e) {} } };
const nf = n => n.toLocaleString('fr-FR');
const PRETTY = { 'Tete': 'Tête', 'mediastin': 'médiastin', 'genital': 'génital', 'Gynecologie': 'Gynécologie', 'Obstetrique': 'Obstétrique', 'Osteo-articulaire': 'Ostéo-articulaire',
  'Pediatrie': 'Pédiatrie', 'Medecine': 'Médecine', 'nucleaire': 'nucléaire' };
const pretty = th => th ? th.replace(/[A-Za-z-]+/g, w => PRETTY[w] || w) : '';
const ORDER = ['Carte', 'Valeurs à retenir', 'Cas clinique', 'Pièges', 'Compte rendu type', 'Formulations du service', 'L’essentiel', 'À retenir', 'Comprendre', 'Tableau', 'Texte', 'Encadré', 'Figure'];
const KCLASS = k => ({ 'Carte': 'Carte', 'Valeurs à retenir': 'Valeurs', 'Compte rendu type': 'CR', 'Formulations du service': 'CR', 'Texte': 'Texte', 'Figure': 'Figure', 'Tableau': 'Tableau', 'Cas clinique': 'Cas' }[k] || 'Box');
const KBOOST = { 'Carte': 1.5, 'Valeurs à retenir': 1.35, 'Compte rendu type': 1.2, 'Formulations du service': 1.2, 'L’essentiel': 1.1, 'Tableau': 1.05, 'Texte': 1, 'Comprendre': 0.95, 'À retenir': 1.1, 'Pièges': 1.1, 'Cas clinique': 1, 'Encadré': 1, 'Figure': 0.75 };
const CLASSIF = /classification|stade|stadification|grade|score|criteres|\btnm\b|figo|rads\b|staging/;
const TYPES = [
  ['Cas cliniques', b => b.k === 'Cas clinique'],
  ['Valeurs à retenir', b => b.k === 'Valeurs à retenir'],
  ['Pièges', b => b.k === 'Pièges'],
  ['Cartes', b => b.k === 'Carte'],

}

// ---------- thème ----------
const applyTheme = t => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
applyTheme(store.get('theme', ''));
$('#theme').onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const nx = cur === 'dark' ? 'light' : 'dark'; applyTheme(nx); store.set('theme', nx); };
load().catch(err => { $('#status').textContent = 'Erreur de chargement de l’index : ' + err.message + ' (navigateur trop ancien ? utilisez Chrome, Edge ou Firefox récents).'; console.error(err); });
</script>
</body>
